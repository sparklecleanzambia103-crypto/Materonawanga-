<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Materonawanga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getStorage, ref as sref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const firebaseConfig = {
    databaseURL: "https://materonawanga-default-rtdb.firebaseio.com"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);
  window._firebase = { db, ref, set, push, onValue, onDisconnect, serverTimestamp, storage, sref, uploadString, getDownloadURL };
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--rose:#E63946;--pink:#FF6B8A;--blush:#FFB3C1;--dark:#1a0a0d;--green:#00C853;}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:white;overflow:hidden;height:100vh;}
#root{width:100%;max-width:430px;margin:0 auto;height:100vh;position:relative;overflow:hidden;background:var(--dark);}
.splash{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 30% 20%,#8b0000 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,#6b0020 0%,transparent 50%),var(--dark);
  padding:2rem;animation:splashIn 0.8s ease;}
@keyframes splashIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.splash-heart{font-size:5rem;animation:heartbeat 1.5s ease infinite;margin-bottom:1rem;}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.splash h1{font-family:'Playfair Display',serif;font-size:2.8rem;color:white;text-align:center;line-height:1.1;}
.splash h1 span{color:var(--pink);font-style:italic;}
.splash p{color:var(--blush);margin:1rem 0 2.5rem;text-align:center;font-size:0.95rem;opacity:0.8;}
.btn-primary{background:linear-gradient(135deg,var(--rose),var(--pink));color:white;border:none;padding:1rem 2.5rem;
  border-radius:50px;font-size:1rem;font-weight:500;cursor:pointer;width:100%;max-width:280px;
  box-shadow:0 8px 30px rgba(230,57,70,0.4);transition:transform 0.2s;font-family:'DM Sans',sans-serif;}
.btn-primary:active{transform:scale(0.97);}
.btn-secondary{background:transparent;color:var(--blush);border:1px solid rgba(255,179,193,0.3);padding:0.8rem 2rem;
  border-radius:50px;font-size:0.9rem;cursor:pointer;margin-top:0.8rem;width:100%;max-width:280px;font-family:'DM Sans',sans-serif;}
.onboard{height:100vh;padding:2rem 1.5rem;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#3d0010 0%,var(--dark) 60%);overflow-y:auto;}
.onboard h2{font-family:'Playfair Display',serif;font-size:1.8rem;margin:1.5rem 0 0.5rem;}
.onboard p.sub{color:var(--blush);font-size:0.9rem;margin-bottom:1.5rem;opacity:0.8;}
.step-dots{display:flex;gap:6px;margin-bottom:1.5rem;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,179,193,0.3);transition:all 0.3s;}
.dot.active{width:24px;border-radius:4px;background:var(--pink);}
.input-group{margin-bottom:1.2rem;}
.input-group label{display:block;color:var(--blush);font-size:0.8rem;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.05em;}
.input-group input,.input-group select,.input-group textarea{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,179,193,0.2);
  color:white;padding:0.85rem 1rem;border-radius:12px;font-size:0.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.2s;}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--pink);}
.input-group select option{background:#1a0a0d;}
.input-group textarea{resize:none;height:80px;}
.home{height:100vh;display:flex;flex-direction:column;background:var(--dark);}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.5rem 0.8rem;}
.top-bar .logo{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--pink);font-style:italic;}
.icon-btn{background:rgba(255,255,255,0.07);border:none;color:white;width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.people-grid{flex:1;overflow-y:auto;padding:0.5rem 1rem;display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;}
.person-card{background:linear-gradient(145deg,#2a0a10,#1a0507);border:1px solid rgba(255,179,193,0.1);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.2s;}
.person-card:active{transform:scale(0.97);}
.pcard-photo{width:100%;height:140px;object-fit:cover;background:radial-gradient(ellipse,#4a0a18 0%,#1a0507 100%);display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative;}
.pcard-photo img{width:100%;height:100%;object-fit:cover;}
.online-dot{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid white;box-shadow:0 0 6px var(--green);}
.offline-dot{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%;background:#666;border:2px solid white;}
.pcard-info{padding:0.6rem 0.8rem;}
.pcard-name{font-family:'Playfair Display',serif;font-size:0.95rem;margin-bottom:0.1rem;}
.pcard-meta{color:var(--blush);font-size:0.72rem;opacity:0.7;}
.msg-btn{background:linear-gradient(135deg,var(--rose),var(--pink));border:none;color:white;width:100%;padding:0.4rem;font-size:0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:0.4rem;border-radius:8px;}
.profile-detail{position:fixed;inset:0;background:var(--dark);z-index:50;display:flex;flex-direction:column;max-width:430px;margin:0 auto;animation:slideUp 0.3s ease;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-photo{width:100%;height:280px;background:radial-gradient(ellipse,#4a0a18 0%,#1a0507 100%);display:flex;align-items:center;justify-content:center;font-size:8rem;flex-shrink:0;position:relative;overflow:hidden;}
.detail-photo img{width:100%;height:100%;object-fit:cover;}
.detail-info{padding:1.2rem 1.5rem;}
.detail-name{font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:0.3rem;}
.detail-meta{color:var(--blush);font-size:0.85rem;opacity:0.7;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem;}
.online-badge{background:var(--green);color:white;font-size:0.7rem;padding:0.15rem 0.5rem;border-radius:20px;font-weight:600;}
.offline-badge{background:#555;color:white;font-size:0.7rem;padding:0.15rem 0.5rem;border-radius:20px;}
.detail-bio{font-size:0.9rem;color:rgba(255,255,255,0.8);line-height:1.5;margin-bottom:1rem;}
.detail-tags{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1.2rem;}
.tag{background:rgba(255,107,138,0.15);border:1px solid rgba(255,107,138,0.3);color:var(--blush);font-size:0.75rem;padding:0.25rem 0.7rem;border-radius:20px;}
.back-btn{position:absolute;top:1rem;left:1rem;background:rgba(0,0,0,0.5);border:none;color:white;width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}
.chat-screen{height:100vh;display:flex;flex-direction:column;background:var(--dark);}
.chat-header{padding:1rem 1.5rem;border-bottom:1px solid rgba(255,179,193,0.1);display:flex;align-items:center;gap:1rem;}
.chat-avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,107,138,0.1);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;flex-shrink:0;position:relative;}
.chat-avatar img{width:100%;height:100%;object-fit:cover;}
.chat-online{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--dark);}
.chat-header-info h3{font-family:'Playfair Display',serif;font-size:1rem;}
.chat-header-info p{font-size:0.75rem;}
.online-text{color:var(--green);}
.offline-text{color:#888;}
.messages{flex:1;overflow-y:auto;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:0.8rem;}
.msg{max-width:75%;padding:0.7rem 1rem;border-radius:18px;font-size:0.9rem;line-height:1.4;animation:msgIn 0.3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.them{background:rgba(255,255,255,0.08);border-radius:18px 18px 18px 4px;align-self:flex-start;}
.msg.me{background:linear-gradient(135deg,var(--rose),var(--pink));border-radius:18px 18px 4px 18px;align-self:flex-end;}
.msg-time{font-size:0.65rem;opacity:0.5;margin-top:3px;}
.chat-input-bar{padding:0.8rem 1rem 1.2rem;display:flex;gap:0.8rem;border-top:1px solid rgba(255,179,193,0.1);}
.chat-input{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,179,193,0.2);color:white;padding:0.75rem 1rem;border-radius:25px;font-size:0.9rem;font-family:'DM Sans',sans-serif;outline:none;}
.send-btn{background:linear-gradient(135deg,var(--rose),var(--pink));border:none;color:white;width:44px;height:44px;border-radius:50%;font-size:1rem;cursor:pointer;flex-shrink:0;}
.inbox{height:100%;display:flex;flex-direction:column;}
.inbox h2{font-family:'Playfair Display',serif;padding:1.5rem 1.5rem 0.5rem;font-size:1.5rem;}
.inbox-list{flex:1;overflow-y:auto;padding:0.5rem 1rem;}
.inbox-item{display:flex;align-items:center;gap:1rem;padding:0.8rem;border-radius:16px;cursor:pointer;transition:background 0.2s;margin-bottom:0.5rem;}
.inbox-item:active{background:rgba(255,255,255,0.05);}
.inbox-avatar{width:52px;height:52px;border-radius:50%;background:rgba(255,107,138,0.1);border:2px solid rgba(255,107,138,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;overflow:hidden;flex-shrink:0;position:relative;}
.inbox-avatar img{width:100%;height:100%;object-fit:cover;}
.inbox-online{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--dark);}
.inbox-info h4{font-size:0.95rem;margin-bottom:0.2rem;}
.inbox-info p{color:var(--blush);font-size:0.8rem;opacity:0.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.premium-screen{height:100%;overflow-y:auto;padding:1.5rem;background:radial-gradient(ellipse at top,#3d1500 0%,var(--dark) 60%);}
.premium-screen h2{font-family:'Playfair Display',serif;font-size:1.8rem;text-align:center;margin-bottom:0.3rem;}
.plan-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,179,193,0.15);border-radius:20px;padding:1.2rem;margin-bottom:1rem;cursor:pointer;transition:all 0.2s;position:relative;}
.plan-card.selected{border-color:var(--pink);background:rgba(255,107,138,0.1);}
.plan-card.popular::before{content:'POPULAR';position:absolute;top:-10px;right:1rem;background:linear-gradient(135deg,var(--rose),var(--pink));color:white;font-size:0.65rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:20px;}
.plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
.plan-name{font-family:'Playfair Display',serif;font-size:1.2rem;}
.plan-price .amount{font-size:1.4rem;font-weight:700;color:var(--pink);}
.plan-price .period{font-size:0.75rem;color:var(--blush);opacity:0.7;display:block;}
.plan-features{list-style:none;}
.plan-features li{font-size:0.82rem;color:rgba(255,255,255,0.75);padding:0.2rem 0;}
.plan-features li::before{content:'✓ ';color:var(--green);font-weight:700;}
.payment-modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.payment-sheet{background:#1f0a0e;border-radius:24px 24px 0 0;padding:1.5rem;width:100%;max-width:430px;border-top:1px solid rgba(255,179,193,0.2);}
.payment-sheet h3{font-family:'Playfair Display',serif;font-size:1.3rem;text-align:center;margin-bottom:0.3rem;}
.airtel-box{background:linear-gradient(135deg,#c8102e,#e63946);border-radius:16px;padding:1.2rem;margin-bottom:1rem;}
.airtel-steps{list-style:none;}
.airtel-steps li{font-size:0.85rem;padding:0.3rem 0;display:flex;gap:0.6rem;align-items:flex-start;}
.step-num{background:rgba(255,255,255,0.2);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;}
.number-box{background:rgba(0,0,0,0.3);border-radius:10px;padding:0.8rem 1rem;margin:0.8rem 0;display:flex;justify-content:space-between;align-items:center;}
.number-box .num{font-size:1.3rem;font-weight:700;}
.copy-btn{background:rgba(255,255,255,0.2);border:none;color:white;padding:0.3rem 0.8rem;border-radius:8px;font-size:0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.copy-btn.copied{background:var(--green);}
.ref-note{background:rgba(255,255,255,0.07);border-radius:12px;padding:0.8rem 1rem;margin-bottom:1rem;font-size:0.82rem;color:var(--blush);line-height:1.5;}
.ref-note strong{color:white;}
.close-sheet{background:rgba(255,255,255,0.07);border:none;color:var(--blush);width:100%;padding:0.8rem;border-radius:12px;font-size:0.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:0.5rem;}
.bottom-nav{display:flex;justify-content:space-around;padding:0.8rem 0 1rem;border-top:1px solid rgba(255,179,193,0.1);background:rgba(26,5,7,0.95);}
.nav-btn{background:none;border:none;color:rgba(255,255,255,0.4);font-size:1.3rem;cursor:pointer;padding:0.3rem 1rem;transition:color 0.2s;}
.nav-btn.active{color:var(--pink);}
.empty-state{text-align:center;padding:3rem 2rem;color:var(--blush);opacity:0.6;}
.empty-state .icon{font-size:3rem;margin-bottom:1rem;}
.loading{text-align:center;padding:2rem;color:var(--blush);opacity:0.6;}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const AIRTEL = "0970953082";
const PLANS = [
  {id:"basic",name:"Basic",price:20,period:"1 week",features:["Unlimited messaging","See all profiles","1 Profile Boost"]},
  {id:"gold",name:"Gold",price:50,period:"1 month",features:["Everything in Basic","3 Profile Boosts","Priority in search","VIP badge"],popular:true},
  {id:"vip",name:"VIP",price:120,period:"3 months",features:["Everything in Gold","Unlimited Boosts","Featured on homepage","Top of search"]},
];
const HOODS = ["Matero Main","Matero North","Matero East","Chelstone","Kaunda Square","Chipata","Mandevu","Chawama","Kanyama"];

function getConvoId(a,b){ return [a,b].sort().join("_"); }

function timeAgo(ts){
  if(!ts) return "";
  const d = Date.now()-ts;
  if(d<60000) return "just now";
  if(d<3600000) return Math.floor(d/60000)+"m ago";
  if(d<86400000) return Math.floor(d/3600000)+"h ago";
  return Math.floor(d/86400000)+"d ago";
}

function App(){
  const [screen,setScreen]=useState("splash");
  const [step,setStep]=useState(0);
  const [myId,setMyId]=useState(null);
  const [myProfile,setMyProfile]=useState({name:"",age:"",hood:"Matero Main",bio:"",photo:"",emoji:"😊",gender:"Female",interests:""});
  const [people,setPeople]=useState({});
  const [onlineStatus,setOnlineStatus]=useState({});
  const [tab,setTab]=useState("browse");
  const [viewPerson,setViewPerson]=useState(null);
  const [activeChat,setActiveChat]=useState(null);
  const [messages,setMessages]=useState([]);
  const [msgInput,setMsgInput]=useState("");
  const [selPlan,setSelPlan]=useState("gold");
  const [showPay,setShowPay]=useState(false);
  const [copied,setCopied]=useState(false);
  const [isPremium,setIsPremium]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [unread,setUnread]=useState(0);
  const fileRef=useRef();
  const msgsEndRef=useRef();

  const fb = ()=>window._firebase;

  // Generate unique user ID
  useEffect(()=>{
    let id = localStorage.getItem("mng_uid");
    if(!id){ id = "user_"+Date.now()+"_"+Math.random().toString(36).substr(2,6); localStorage.setItem("mng_uid",id); }
    setMyId(id);
    const saved = localStorage.getItem("mng_profile");
    if(saved){ const p=JSON.parse(saved); setMyProfile(p); setScreen("home"); }
  },[]);

  // Load all users
  useEffect(()=>{
    if(!myId||!fb()) return;
    const {db,ref,onValue}=fb();
    const unsub = onValue(ref(db,"users"),snap=>{
      if(snap.exists()) setPeople(snap.val()||{});
    });
    return ()=>unsub();
  },[myId]);

  // Track online status
  useEffect(()=>{
    if(!myId||!fb()) return;
    const {db,ref,set,onDisconnect,serverTimestamp,onValue}=fb();
    const onlineRef = ref(db,`online/${myId}`);
    set(onlineRef,{online:true,last_seen:serverTimestamp()});
    onDisconnect(onlineRef).set({online:false,last_seen:serverTimestamp()});
    const unsub = onValue(ref(db,"online"),snap=>{
      if(snap.exists()) setOnlineStatus(snap.val()||{});
    });
    return ()=>unsub();
  },[myId]);

  // Load messages for active chat
  useEffect(()=>{
    if(!myId||!activeChat||!fb()) return;
    const {db,ref,onValue}=fb();
    const cid = getConvoId(myId,activeChat.id);
    const unsub = onValue(ref(db,`messages/${cid}`),snap=>{
      if(snap.exists()){
        const msgs = Object.values(snap.val()).sort((a,b)=>a.ts-b.ts);
        setMessages(msgs);
        setTimeout(()=>msgsEndRef.current?.scrollIntoView({behavior:"smooth"}),100);
      } else { setMessages([]); }
    });
    return ()=>unsub();
  },[myId,activeChat]);

  const handlePhoto = e=>{
    const file=e.target.files[0]; if(!file) return;
    setUploading(true);
    const reader=new FileReader();
    reader.onload=ev=>{ setMyProfile(p=>({...p,photo:ev.target.result})); setUploading(false); };
    reader.readAsDataURL(file);
  };

  const saveProfile = ()=>{
    if(!myId||!fb()) return;
    const {db,ref,set}=fb();
    const p={...myProfile,id:myId,interests:typeof myProfile.interests==="string"?myProfile.interests.split(",").map(s=>s.trim()).filter(Boolean):myProfile.interests};
    localStorage.setItem("mng_profile",JSON.stringify(p));
    set(ref(db,`users/${myId}`),{...p,lastSeen:Date.now()});
    setMyProfile(p);
    setScreen("home");
  };

  const sendMsg=()=>{
    if(!msgInput.trim()||!myId||!activeChat||!fb()) return;
    const {db,ref,push}=fb();
    const cid=getConvoId(myId,activeChat.id);
    push(ref(db,`messages/${cid}`),{text:msgInput,from:myId,fromName:myProfile.name,ts:Date.now()});
    setMsgInput("");
  };

  const isOnline=id=>onlineStatus[id]?.online===true;
  const plan=PLANS.find(p=>p.id===selPlan);
  const otherPeople=Object.values(people).filter(p=>p.id!==myId);

  return <div>
    {screen==="splash"&&<div className="splash">
      <div className="splash-heart">💕</div>
      <h1>Matero<span>nawanga</span></h1>
      <p>Find love in your neighborhood 🇿🇲<br/>Matero & surrounding areas</p>
      <button className="btn-primary" onClick={()=>setScreen("onboard")}>Get Started — It's Free</button>
      <button className="btn-secondary" onClick={()=>setScreen("home")}>Browse as Guest</button>
    </div>}

    {screen==="onboard"&&<div className="onboard">
      <div className="step-dots">{[0,1,2].map(i=><div key={i} className={"dot"+(i===step?" active":"")}/>)}</div>
      {step===0&&<>
        <h2>Your Profile</h2><p className="sub">Let people know who you are</p>
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:"1rem"}}>
          <div style={{width:100,height:100,borderRadius:"50%",border:"3px solid var(--pink)",overflow:"hidden",background:"rgba(255,107,138,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"3rem",marginBottom:"0.5rem",cursor:"pointer"}} onClick={()=>fileRef.current.click()}>
            {myProfile.photo?<img src={myProfile.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"📷"}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handlePhoto}/>
          <button className="btn-secondary" style={{maxWidth:"160px",marginTop:0,padding:"0.4rem 1rem",fontSize:"0.8rem"}} onClick={()=>fileRef.current.click()}>{uploading?"Uploading...":"📷 Upload Photo"}</button>
        </div>
        <div className="input-group"><label>First Name</label><input placeholder="e.g. Chanda" value={myProfile.name} onChange={e=>setMyProfile({...myProfile,name:e.target.value})}/></div>
        <div className="input-group"><label>Age</label><input type="number" placeholder="e.g. 24" value={myProfile.age} onChange={e=>setMyProfile({...myProfile,age:e.target.value})}/></div>
        <div className="input-group"><label>Gender</label><select value={myProfile.gender} onChange={e=>setMyProfile({...myProfile,gender:e.target.value})}><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div style={{marginTop:"auto"}}><button className="btn-primary" style={{maxWidth:"100%"}} onClick={()=>myProfile.name&&myProfile.age&&setStep(1)}>Continue →</button></div>
      </>}
      {step===1&&<>
        <h2>Where are you?</h2><p className="sub">Find people near you</p>
        <div className="input-group"><label>Neighborhood</label><select value={myProfile.hood} onChange={e=>setMyProfile({...myProfile,hood:e.target.value})}>{HOODS.map(n=><option key={n}>{n}</option>)}</select></div>
        <div className="input-group"><label>About You</label><textarea placeholder="Tell people something about yourself..." value={myProfile.bio} onChange={e=>setMyProfile({...myProfile,bio:e.target.value})}/></div>
        <div className="input-group"><label>Interests (comma separated)</label><input placeholder="e.g. Dancing, Football, Music" value={myProfile.interests} onChange={e=>setMyProfile({...myProfile,interests:e.target.value})}/></div>
        <div style={{marginTop:"auto"}}><button className="btn-primary" style={{maxWidth:"100%"}} onClick={()=>setStep(2)}>Continue →</button></div>
      </>}
      {step===2&&<>
        <h2>Almost done! 🎉</h2><p className="sub">Review your profile</p>
        <div style={{background:"rgba(255,255,255,0.05)",borderRadius:"20px",padding:"1.2rem",marginBottom:"1.5rem",textAlign:"center"}}>
          <div style={{width:80,height:80,borderRadius:"50%",border:"3px solid var(--pink)",overflow:"hidden",background:"rgba(255,107,138,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"2.5rem",margin:"0 auto 0.8rem"}}>
            {myProfile.photo?<img src={myProfile.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"😊"}
          </div>
          <p style={{fontFamily:"'Playfair Display',serif",fontSize:"1.2rem"}}>{myProfile.name||"Your Name"}, {myProfile.age||"?"}</p>
          <p style={{color:"var(--blush)",fontSize:"0.85rem",marginTop:"0.3rem"}}>📍 {myProfile.hood} · {myProfile.gender}</p>
          <p style={{fontSize:"0.85rem",marginTop:"0.5rem",opacity:0.8}}>{myProfile.bio||"No bio yet"}</p>
        </div>
        <button className="btn-primary" style={{maxWidth:"100%"}} onClick={saveProfile}>Start Meeting People 💕</button>
        <button className="btn-secondary" style={{maxWidth:"100%"}} onClick={()=>setStep(1)}>← Edit Profile</button>
      </>}
    </div>}

    {screen==="home"&&<div className="home">
      <div className="top-bar">
        <span className="logo">Materonawanga {isPremium&&<span style={{fontSize:"0.7rem",color:"gold"}}>⭐</span>}</span>
        <div style={{display:"flex",gap:"0.5rem"}}>
          <button className="icon-btn" onClick={()=>setTab("inbox")}>💌</button>
          <button className="icon-btn" onClick={()=>setTab("premium")}>👑</button>
        </div>
      </div>

      {tab==="browse"&&<>
        <div style={{padding:"0 1rem 0.5rem",color:"var(--blush)",fontSize:"0.85rem"}}>{otherPeople.length} people near you 📍</div>
        <div className="people-grid">
          {otherPeople.length===0&&<div style={{gridColumn:"1/-1"}}><div className="empty-state"><div className="icon">👥</div><p>No one here yet</p><p style={{fontSize:"0.85rem",marginTop:"0.5rem"}}>Share the app to get people joining!</p></div></div>}
          {otherPeople.map(p=><div key={p.id} className="person-card">
            <div className="pcard-photo" onClick={()=>setViewPerson(p)}>
              {p.photo?<img src={p.photo} onError={e=>e.target.style.display="none"}/>:<span>{p.emoji||"😊"}</span>}
              {isOnline(p.id)?<div className="online-dot"/>:<div className="offline-dot"/>}
            </div>
            <div className="pcard-info">
              <div className="pcard-name">{p.name}, {p.age}</div>
              <div className="pcard-meta">📍 {p.hood}</div>
              <button className="msg-btn" onClick={()=>{setActiveChat(p);setTab("chat");}}>💬 Message</button>
            </div>
          </div>)}
        </div>
      </>}

      {tab==="inbox"&&<div className="inbox" style={{height:"calc(100vh - 120px)"}}>
        <h2>Messages 💌</h2>
        <div className="inbox-list">
          {otherPeople.length===0?<div className="empty-state"><div className="icon">💬</div><p>No conversations yet</p></div>
          :otherPeople.map(p=><div key={p.id} className="inbox-item" onClick={()=>{setActiveChat(p);setTab("chat");}}>
            <div className="inbox-avatar">
              {p.photo?<img src={p.photo} onError={e=>e.target.style.display="none"}/>:p.emoji||"😊"}
              {isOnline(p.id)&&<div className="inbox-online"/>}
            </div>
            <div className="inbox-info">
              <h4>{p.name}, {p.age} {isOnline(p.id)&&<span style={{color:"var(--green)",fontSize:"0.7rem"}}>● Online</span>}</h4>
              <p>Tap to chat</p>
            </div>
          </div>)}
        </div>
      </div>}

      {tab==="chat"&&activeChat&&<div className="chat-screen" style={{height:"calc(100vh - 60px)"}}>
        <div className="chat-header">
          <button style={{background:"none",border:"none",color:"var(--blush)",fontSize:"1.2rem",cursor:"pointer",marginRight:"0.5rem"}} onClick={()=>setTab("inbox")}>←</button>
          <div className="chat-avatar">
            {activeChat.photo?<img src={activeChat.photo} onError={e=>e.target.style.display="none"}/>:activeChat.emoji||"😊"}
            {isOnline(activeChat.id)&&<div className="chat-online"/>}
          </div>
          <div className="chat-header-info">
            <h3>{activeChat.name}</h3>
            <p className={isOnline(activeChat.id)?"online-text":"offline-text"}>{isOnline(activeChat.id)?"● Online now":"○ Offline"}</p>
          </div>
        </div>
        <div className="messages">
          {messages.length===0&&<div className="empty-state" style={{padding:"2rem"}}><p>Say hi to {activeChat.name}! 👋</p></div>}
          {messages.map((m,i)=><div key={i} className={"msg "+(m.from===myId?"me":"them")}>
            <div>{m.text}</div>
            <div className="msg-time">{timeAgo(m.ts)}</div>
          </div>)}
          <div ref={msgsEndRef}/>
        </div>
        <div className="chat-input-bar">
          <input className="chat-input" placeholder={`Message ${activeChat.name}...`} value={msgInput} onChange={e=>setMsgInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendMsg()}/>
          <button className="send-btn" onClick={sendMsg}>➤</button>
        </div>
      </div>}

      {tab==="premium"&&<div style={{height:"calc(100vh - 60px)",overflowY:"auto"}}>
        <div className="premium-screen">
          <div style={{fontSize:"2.5rem",textAlign:"center",marginBottom:"0.5rem"}}>👑</div>
          <h2>Go Premium</h2>
          <p style={{color:"var(--blush)",textAlign:"center",fontSize:"0.85rem",opacity:0.8,marginBottom:"1.5rem"}}>Unlock the full experience</p>
          {isPremium?<div style={{textAlign:"center",padding:"2rem",background:"rgba(255,215,0,0.1)",borderRadius:"20px",border:"1px solid rgba(255,215,0,0.3)"}}>
            <div style={{fontSize:"3rem",marginBottom:"0.8rem"}}>⭐</div>
            <p style={{color:"gold",fontFamily:"'Playfair Display',serif",fontSize:"1.2rem"}}>You're a Premium Member!</p>
          </div>:<>
            {PLANS.map(p=><div key={p.id} className={"plan-card"+(selPlan===p.id?" selected":"")+(p.popular?" popular":"")} onClick={()=>setSelPlan(p.id)}>
              <div className="plan-header"><div className="plan-name">{p.name}</div><div className="plan-price"><span className="amount">K{p.price}</span><span className="period">{p.period}</span></div></div>
              <ul className="plan-features">{p.features.map(f=><li key={f}>{f}</li>)}</ul>
            </div>)}
            <button className="btn-primary" style={{maxWidth:"100%",marginTop:"0.5rem"}} onClick={()=>setShowPay(true)}>Pay with Airtel Money — K{plan?.price}</button>
          </>}
        </div>
      </div>}

      {tab==="myprofile"&&<div style={{height:"calc(100vh - 60px)",overflowY:"auto",padding:"1.5rem"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",marginBottom:"1.5rem"}}>My Profile</h2>
        <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
          <div style={{width:100,height:100,borderRadius:"50%",border:"3px solid var(--pink)",overflow:"hidden",background:"rgba(255,107,138,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"3rem",margin:"0 auto 0.5rem",cursor:"pointer"}} onClick={()=>fileRef.current?.click()}>
            {myProfile.photo?<img src={myProfile.photo} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"😊"}
          </div>
          <p style={{fontFamily:"'Playfair Display',serif",fontSize:"1.3rem"}}>{myProfile.name||"Guest"}</p>
          <p style={{color:"var(--green)",fontSize:"0.85rem",marginTop:"0.3rem"}}>● Online</p>
          <p style={{color:"var(--blush)",fontSize:"0.85rem"}}>📍 {myProfile.hood}</p>
        </div>
        <button className="btn-secondary" style={{maxWidth:"100%"}} onClick={()=>{setStep(0);setScreen("onboard");}}>✏️ Edit Profile</button>
      </div>}

      {tab!=="chat"&&<div className="bottom-nav">
        <button className={"nav-btn"+(tab==="browse"?" active":"")} onClick={()=>setTab("browse")}>👥</button>
        <button className={"nav-btn"+(tab==="inbox"?" active":"")} onClick={()=>setTab("inbox")}>💌</button>
        <button className={"nav-btn"+(tab==="premium"?" active":"")} onClick={()=>setTab("premium")}>👑</button>
        <button className={"nav-btn"+(tab==="myprofile"?" active":"")} onClick={()=>setTab("myprofile")}>👤</button>
      </div>}
    </div>}

    {viewPerson&&<div className="profile-detail">
      <div className="detail-photo">
        {viewPerson.photo?<img src={viewPerson.photo} onError={e=>e.target.style.display="none"}/>:viewPerson.emoji||"😊"}
        <button className="back-btn" onClick={()=>setViewPerson(null)}>←</button>
      </div>
      <div className="detail-info">
        <div className="detail-name">{viewPerson.name}, {viewPerson.age}</div>
        <div className="detail-meta">
          📍 {viewPerson.hood} · {viewPerson.gender}
          {isOnline(viewPerson.id)?<span className="online-badge">● Online</span>:<span className="offline-badge">Offline</span>}
        </div>
        <div className="detail-bio">{viewPerson.bio}</div>
        {viewPerson.interests?.length>0&&<div className="detail-tags">{(Array.isArray(viewPerson.interests)?viewPerson.interests:viewPerson.interests.split(",")).map((i,idx)=><span key={idx} className="tag">{i.trim()}</span>)}</div>}
        <button className="btn-primary" style={{maxWidth:"100%"}} onClick={()=>{setViewPerson(null);setActiveChat(viewPerson);setTab("chat");}}>💬 Send Message</button>
      </div>
    </div>}

    {showPay&&plan&&<div className="payment-modal">
      <div className="payment-sheet">
        <h3>Pay with Airtel Money</h3>
        <p style={{color:"var(--blush)",textAlign:"center",fontSize:"0.82rem",marginBottom:"1.5rem"}}>Activate <strong style={{color:"white"}}>{plan.name}</strong> — <span style={{color:"var(--pink)"}}>K{plan.price}</span> for {plan.period}</p>
        <div className="airtel-box">
          <div style={{fontWeight:700,marginBottom:"0.8rem"}}>📱 AIRTEL MONEY</div>
          <ul className="airtel-steps">
            <li><span className="step-num">1</span><span>Dial <strong>*778#</strong> on your Airtel line</span></li>
            <li><span className="step-num">2</span><span>Select <strong>"Send Money"</strong></span></li>
            <li><span className="step-num">3</span><span>Enter this number:</span></li>
          </ul>
          <div className="number-box">
            <span className="num">{AIRTEL}</span>
            <button className={"copy-btn"+(copied?" copied":"")} onClick={()=>{navigator.clipboard?.writeText(AIRTEL);setCopied(true);setTimeout(()=>setCopied(false),2000);}}>{copied?"Copied ✓":"Copy"}</button>
          </div>
          <ul className="airtel-steps">
            <li><span className="step-num">4</span><span>Amount: <strong>K{plan.price}</strong></span></li>
            <li><span className="step-num">5</span><span>Use your name as reference</span></li>
          </ul>
        </div>
        <div className="ref-note">📌 After paying, WhatsApp your <strong>transaction ID</strong> to <strong>{AIRTEL}</strong>:<br/><br/><em>"Materonawanga {plan.name} - [your name]"</em><br/><br/>Activated within <strong>1 hour</strong>.</div>
        <button className="btn-primary" style={{maxWidth:"100%",marginBottom:"0.5rem"}} onClick={()=>{setShowPay(false);setIsPremium(true);setTab("premium");}}>I've Paid — Activate ✓</button>
        <button className="close-sheet" onClick={()=>setShowPay(false)}>Cancel</button>
      </div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
